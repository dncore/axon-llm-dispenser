[package]
name = "axon-llm-dispenser"
version = "0.1.0"
description = "把用户自有的 OpenAI 兼容网关一键接入 Codex / Reasonix / DeepSeek Harness"
edition = "2021"

[lib]
name = "axon_llm_dispenser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
serde_yaml = "0.9"
glob = "0.3"
ureq = { version = "2", features = ["json"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
