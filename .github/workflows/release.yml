name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm install

      - name: Build (macOS)
        if: matrix.target == 'macos'
        run: npx tauri build --bundles app
        env:
          # ad-hoc 签名:让 arm64 可运行、提示从「已损坏」变为「无法验证开发者」(可右键打开)
          APPLE_SIGNING_IDENTITY: "-"

      - name: Ad-hoc sign macOS app
        if: matrix.target == 'macos'
        run: |
          APP="src-tauri/target/release/bundle/macos/axon-llm-dispenser.app"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" "axon-llm-dispenser-macos-${{ github.ref_name }}.zip"

      - name: Build (Windows)
        if: matrix.target == 'windows'
        run: npx tauri build --bundles nsis

      - name: Package Windows portable zip
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $dir = "src-tauri/target/release"
          $files = @("axon-llm-dispenser.exe")
          if (Test-Path "$dir/WebView2Loader.dll") { $files += "WebView2Loader.dll" }
          Compress-Archive -Path ($files | ForEach-Object { "$dir/$_" }) -DestinationPath "axon-llm-dispenser-windows-${{ github.ref_name }}.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: axon-llm-dispenser-${{ matrix.target }}-${{ github.ref_name }}
          path: |
            *.zip
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: ignore

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
