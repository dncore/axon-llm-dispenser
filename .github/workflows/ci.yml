name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test
        run: npm test
      - name: Model-meta drift check (canonical gist)
        run: npm run check:models
