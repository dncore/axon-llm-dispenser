name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm install

      - name: Build (macOS)
        if: matrix.target == 'macos'
        run: npx tauri build --bundles app
        env:
          # ad-hoc 签名:让 arm64 可运行、提示从「已损坏」变为「无法验证开发者」(可右键打开)
          APPLE_SIGNING_IDENTITY: "-"

      - name: Ad-hoc sign macOS app
        if: matrix.target == 'macos'
        run: |
          APP="src-tauri/target/release/bundle/macos/axon-llm-dispenser.app"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" "axon-llm-dispenser-macos-${{ github.ref_name }}.zip"
          echo "ZIP_NAME=axon-llm-dispenser-macos-${{ github.ref_name }}.zip" >> "$GITHUB_ENV"
          echo "SHA256=$(shasum -a 256 "axon-llm-dispenser-macos-${{ github.ref_name }}.zip" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Sync Homebrew cask (macOS)
        if: matrix.target == 'macos'
        run: |
          echo "macos zip: $ZIP_NAME  sha256: $SHA256"
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "${{ secrets.TAP_SSH_KEY }}" ]; then
            echo "⚠️ TAP_SSH_KEY 未配置,跳过自动同步 cask 到 tap 仓库(sha256 已打印,可手动更新)"
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "${{ secrets.TAP_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf /tmp/taptap && git clone git@github.com:dncore/homebrew-axon-llm-dispenser.git /tmp/taptap
          cd /tmp/taptap
          sed "s/__VERSION__/$VERSION/; s/__SHA256__/$SHA256/" "$GITHUB_WORKSPACE/homebrew/axon-llm-dispenser.rb.template" > Casks/axon-llm-dispenser.rb
          git add Casks/axon-llm-dispenser.rb
          if git diff --cached --quiet; then
            echo "cask 无变化,跳过推送"
          else
            git commit -m "Update axon-llm-dispenser cask v$VERSION"
            git push origin master
          fi

      - name: Build (Windows)
        if: matrix.target == 'windows'
        run: npx tauri build --bundles nsis

      - name: Package Windows portable zip
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $dir = "src-tauri/target/release"
          $files = @("axon-llm-dispenser.exe")
          if (Test-Path "$dir/WebView2Loader.dll") { $files += "WebView2Loader.dll" }
          Compress-Archive -Path ($files | ForEach-Object { "$dir/$_" }) -DestinationPath "axon-llm-dispenser-windows-${{ github.ref_name }}.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: axon-llm-dispenser-${{ matrix.target }}-${{ github.ref_name }}
          path: "*.zip"
          if-no-files-found: error

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
